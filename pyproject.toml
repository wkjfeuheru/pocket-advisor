[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "2.1.0"
description = "金融投顾业务系统 —— 模拟交易（商品 / 持仓 / 账户 / 认证 / 管理）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Finance Agent Team"}
]
keywords = ["finance", "investment", "portfolio", "fastapi", "a-shares"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.2.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "httpx>=0.28",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-mcp-adapters>=0.1,<1",
    "langgraph-checkpoint-postgres>=2,<4",
    "mcp>=1.24,<2",
    "tushare>=1.4",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "httpx",
]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

# 产品种子样例 JSON 随包分发，便于运维生成 007 种子脚本。
[tool.setuptools.package-data]
scripts = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: 需要真实第三方接口的冒烟测试（默认跳过，设置 RUN_NETWORK_TESTS=1 启用）",
]
