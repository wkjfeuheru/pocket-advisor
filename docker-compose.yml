services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-advisor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-agent-api:local
    command: ["python", "-m", "scripts.migrate", "--seed"]
    env_file:
      - .env
    environment: &app-environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-advisor}
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      APP_ENV: ${APP_ENV:-production}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      FINANCE_SQL_DIR: /app/migrations
      ADVISOR_MODEL_API_KEY: ${ADVISOR_MODEL_API_KEY:-}
      ADVISOR_MODEL_BASE_URL: ${ADVISOR_MODEL_BASE_URL:-https://api.deepseek.com}
      ADVISOR_MODEL_NAME: ${ADVISOR_MODEL_NAME:-deepseek-chat}
      FUYAO_API_KEY: ${FUYAO_API_KEY:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      AGENT_TURN_TIMEOUT_SECONDS: ${AGENT_TURN_TIMEOUT_SECONDS:-120}
      AGENT_MAX_MESSAGE_CHARS: ${AGENT_MAX_MESSAGE_CHARS:-4000}
      AGENT_CONTEXT_MESSAGE_LIMIT: ${AGENT_CONTEXT_MESSAGE_LIMIT:-20}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: finance-agent-api:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
